<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chimney & Gas Service Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6fb;color:#172033}header{background:#ff6b35;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:10}.head{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:20px;margin:0}.sub{font-size:12px;opacity:.9}.menuBtn{background:#fff;color:#ff6b35;border:0;border-radius:10px;padding:9px 12px;font-weight:700}.wrap{max-width:980px;margin:auto;padding:14px}.card{background:#fff;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #00000012}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:650px){.grid{grid-template-columns:1fr}}label{font-size:13px;font-weight:700;display:block;margin:0 0 5px}input,select,textarea{width:100%;padding:12px;border:1px solid #d7dce5;border-radius:10px;font-size:15px;background:#fff}textarea{min-height:70px;resize:vertical}.serviceBtns{display:flex;gap:8px}.serviceBtns button{flex:1;background:#fff;border:1px solid #d7dce5;color:#333;padding:12px;border-radius:10px;font-weight:700}.serviceBtns button.active{background:#ff6b35;color:#fff;border-color:#ff6b35}.hidden{display:none!important}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;cursor:pointer}.primary{background:#ff6b35;color:#fff}.green{background:#1d9b5c;color:#fff}.blue{background:#2878d8;color:#fff}.gray{background:#e9edf3;color:#172033}.danger{background:#d9363e;color:#fff}.list{display:grid;gap:10px}.item{border:1px solid #e1e5ec;border-radius:12px;padding:13px;background:#fff}.itemTop{display:flex;justify-content:space-between;gap:10px}.tag{display:inline-block;background:#fff0e9;color:#d95122;padding:4px 8px;border-radius:20px;font-size:11px;font-weight:700}.amount{font-size:18px;font-weight:800}.small{font-size:12px;color:#667085}.menu{display:none;position:absolute;right:14px;top:60px;background:#fff;border-radius:14px;box-shadow:0 8px 25px #0003;overflow:hidden;min-width:220px}.menu.open{display:block}.menu button{display:block;width:100%;padding:13px 15px;border:0;background:#fff;text-align:left;font-weight:700}.menu button:hover{background:#f3f5f8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:650px){.stats{grid-template-columns:repeat(2,1fr)}}.stat{background:#fff;border-radius:14px;padding:13px;box-shadow:0 2px 10px #0000000d}.stat b{display:block;font-size:19px;margin-top:5px}.reportBox{display:none}.reportBox.show{display:block}.muted{color:#667085}.empty{text-align:center;padding:25px;color:#667085}
</style></head>
<body>
<header><div class="head"><div><h1>Chimney & Gas Service</h1><div class="sub">Customer • Service • Amount • Reminder</div></div><button class="menuBtn" onclick="toggleMenu()">☰ Menu</button></div><div id="menu" class="menu"><button onclick="showReport('monthly');closeMenu()">📊 Monthly Report</button><button onclick="showReport('yearly');closeMenu()">📈 Yearly Report</button><button onclick="exportExcel();closeMenu()">⬇️ Download Excel Report</button><button onclick="shareApp();closeMenu()">📤 Share</button><button onclick="backup();closeMenu()">💾 Backup Data</button><button onclick="restore();closeMenu()">📥 Restore Data</button></div></header>
<div class="wrap">
<div class="stats"><div class="stat">Customers<b id="sCustomers">0</b></div><div class="stat">Services<b id="sServices">0</b></div><div class="stat">Collected<b id="sCollected">₹0</b></div><div class="stat">Pending<b id="sPending">₹0</b></div></div>
<div class="card"><h2 id="formTitle">Add Service</h2><div class="grid">
<div><label>Customer Name</label><input id="name" placeholder="Customer name"></div>
<div><label>Mobile Number</label><input id="phone" type="tel" placeholder="Mobile number"></div>
<div><label>Address</label><textarea id="address" placeholder="Address"></textarea></div>
<div><label>Service Date</label><input id="serviceDate" type="date"></div>
<div><label>Service Type</label><div class="serviceBtns"><button id="chimneyBtn" onclick="chooseType('Chimney')">Chimney Service</button><button id="gasBtn" onclick="chooseType('Gas')">Gas Service</button></div></div>
<div><label>Service / Product</label><select id="product"><option value="">Select after choosing service</option></select><button class="btn gray" style="margin-top:7px;width:100%" onclick="toggleAdditional()">＋ Add Additional Service / Product</button><div id="additionalWrap" class="hidden" style="margin-top:8px"><input id="additional" placeholder="Additional service/product"></div></div>
<div><label>Service Amount ₹</label><input id="amount" type="number" min="0" placeholder="Amount"></div>
<div><label>Payment Status</label><select id="payment"><option value="Paid">Paid</option><option value="Pending">Pending</option><option value="Partial">Partial</option></select></div>
<div><label>Next Reminder</label><select id="months"><option value="0">None</option><option value="1">1 Month</option><option value="2">2 Months</option><option value="3" selected>3 Months</option><option value="6">6 Months</option><option value="12">12 Months</option></select></div>
<div><label>Google Location</label><input id="location" placeholder="Paste Google Maps link or coordinates"><button class="btn blue" style="margin-top:7px;width:100%" onclick="openLocationInput()">📍 Open / Set Location</button></div>
<div style="grid-column:1/-1"><label>Notes</label><textarea id="notes" placeholder="Notes"></textarea></div>
</div><div class="btns"><button class="btn primary" onclick="saveService()" id="saveBtn">Save Service</button><button class="btn gray" onclick="resetForm()">Clear</button><button class="btn green" onclick="shareApp()">📤 Share</button></div></div>
<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">Customers & Services</h2><input id="search" style="max-width:230px" placeholder="Search customer..." oninput="render()"></div><div id="list" class="list" style="margin-top:12px"></div></div>
<div id="report" class="card reportBox"><h2 id="reportTitle"></h2><div id="reportContent"></div></div>
</div>
<script>
const KEY='chimney_service_data_v3';let data=JSON.parse(localStorage.getItem(KEY)||'[]');let editId=null,serviceType='';
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function toggleMenu(){document.getElementById('menu').classList.toggle('open')}function closeMenu(){document.getElementById('menu').classList.remove('open')}
function chooseType(t){serviceType=t;document.getElementById('chimneyBtn').classList.toggle('active',t==='Chimney');document.getElementById('gasBtn').classList.toggle('active',t==='Gas');const p=document.getElementById('product');p.innerHTML='<option value="">Select service/product</option>';let arr=t==='Chimney'?['General Chimney Service','Deep Cleaning','Motor Service','Filter Cleaning','Chimney Installation']:['Gas Stove Service','Gas Pipe Service','Burner Cleaning','Gas Leak Check','Gas Regulator Service'];arr.forEach(x=>p.insertAdjacentHTML('beforeend',`<option>${x}</option>`));document.getElementById('additionalWrap').classList.add('hidden');document.getElementById('additional').value=''}
function toggleAdditional(){if(!serviceType){alert('First choose Chimney Service or Gas Service');return}document.getElementById('additionalWrap').classList.toggle('hidden')}
function addMonths(dateStr,m){if(!m)return '';let d=new Date(dateStr+'T12:00:00');d.setMonth(d.getMonth()+Number(m));return d.toISOString().slice(0,10)}
function openLocationInput(){let v=document.getElementById('location').value.trim();if(v){window.open(v.startsWith('http')?v:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v),'_blank');return}let q=prompt('Paste Google Maps link or enter address/location:');if(q){document.getElementById('location').value=q}}
function saveService(){let name=document.getElementById('name').value.trim();if(!name){alert('Customer name required');return}if(!serviceType){alert('Choose Chimney Service or Gas Service');return}let date=document.getElementById('serviceDate').value;if(!date){alert('Service date required');return}let obj={id:editId||Date.now(),name,phone:document.getElementById('phone').value,address:document.getElementById('address').value,date,type:serviceType,product:document.getElementById('product').value,additional:document.getElementById('additional').value,amount:Number(document.getElementById('amount').value||0),payment:document.getElementById('payment').value,months:document.getElementById('months').value,nextDate:addMonths(date,document.getElementById('months').value),location:document.getElementById('location').value,notes:document.getElementById('notes').value};if(editId)data=data.map(x=>x.id===editId?obj:x);else data.unshift(obj);save();resetForm();alert('Saved successfully')}
function resetForm(){editId=null;document.getElementById('formTitle').textContent='Add Service';document.getElementById('saveBtn').textContent='Save Service';['name','phone','address','serviceDate','amount','location','notes','additional'].forEach(id=>document.getElementById(id).value='');document.getElementById('payment').value='Paid';document.getElementById('months').value='3';document.getElementById('product').innerHTML='<option value="">Select after choosing service</option>';document.getElementById('additionalWrap').classList.add('hidden');serviceType='';document.querySelectorAll('.serviceBtns button').forEach(b=>b.classList.remove('active'))}
function edit(id){let x=data.find(a=>a.id===id);if(!x)return;editId=id;document.getElementById('formTitle').textContent='Edit Service';document.getElementById('saveBtn').textContent='Update Service';['name','phone','address','serviceDate','amount','location','notes','additional'].forEach(id=>document.getElementById(id).value=x[id]||'');document.getElementById('payment').value=x.payment;document.getElementById('months').value=x.months||'0';chooseType(x.type);document.getElementById('product').value=x.product||'';if(x.additional){document.getElementById('additionalWrap').classList.remove('hidden')}scrollTo({top:0,behavior:'smooth'})}
function del(id){if(confirm('Delete this service record?')){data=data.filter(x=>x.id!==id);save()}}
function renew(id){let x=data.find(a=>a.id===id);if(!x)return;let months=Number(x.months||3);if(!months){alert('This customer has reminder set to None. Choose a month first.');return}x.date=x.nextDate||x.date;x.nextDate=addMonths(x.date,months);save();alert('Next service updated to '+x.nextDate)}
function render(){let q=document.getElementById('search').value.toLowerCase();let arr=data.filter(x=>(x.name+' '+x.phone+' '+x.address).toLowerCase().includes(q));document.getElementById('list').innerHTML=arr.length?arr.map(x=>`<div class="item"><div class="itemTop"><div><b>${esc(x.name)}</b> <span class="tag">${esc(x.type)}</span><div class="small">${esc(x.phone||'')} • ${esc(x.product||'')}${x.additional?' + '+esc(x.additional):''}</div></div><div class="amount">₹${x.amount.toLocaleString('en-IN')}</div></div><div style="margin-top:8px" class="small">Service: ${x.date} | Next: ${x.nextDate||'None'} | ${x.payment}</div>${x.address?`<div class="small">📍 ${esc(x.address)}</div>`:''}<div class="btns"><button class="btn gray" onclick="edit(${x.id})">Edit</button><button class="btn danger" onclick="del(${x.id})">Delete</button><button class="btn green" onclick="renew(${x.id})">Renew</button>${x.location?`<button class="btn blue" onclick="window.open('${escAttr(x.location)}','_blank')">📍 Maps</button>`:''}</div></div>`).join(''):'<div class="empty">No customers found</div>';let collected=data.filter(x=>x.payment==='Paid').reduce((s,x)=>s+x.amount,0);let pending=data.filter(x=>x.payment!=='Paid').reduce((s,x)=>s+x.amount,0);document.getElementById('sCustomers').textContent=new Set(data.map(x=>x.name)).size;document.getElementById('sServices').textContent=data.length;document.getElementById('sCollected').textContent='₹'+collected.toLocaleString('en-IN');document.getElementById('sPending').textContent='₹'+pending.toLocaleString('en-IN')}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function escAttr(s){return String(s||'').replace(/'/g,"%27")}
function showReport(kind){let now=new Date(),year=now.getFullYear(),month=now.getMonth()+1;let arr=data.filter(x=>{let d=new Date(x.date+'T12:00:00');return kind==='yearly'?d.getFullYear()===year:d.getFullYear()===year&&d.getMonth()+1===month});let total=arr.reduce((s,x)=>s+x.amount,0),paid=arr.filter(x=>x.payment==='Paid').reduce((s,x)=>s+x.amount,0);document.getElementById('reportTitle').textContent=kind==='yearly'?`Yearly Report – ${year}`:`Monthly Report – ${String(month).padStart(2,'0')}/${year}`;document.getElementById('reportContent').innerHTML=`<b>Services:</b> ${arr.length}<br><b>Total:</b> ₹${total.toLocaleString('en-IN')}<br><b>Paid:</b> ₹${paid.toLocaleString('en-IN')}<br><b>Pending/Partial:</b> ₹${(total-paid).toLocaleString('en-IN')}<hr>`+(arr.length?arr.map(x=>`${esc(x.date)} — ${esc(x.name)} — ${esc(x.type)} — ₹${x.amount.toLocaleString('en-IN')} — ${esc(x.payment)}`).join('<br>'):'No records');document.getElementById('report').classList.add('show');scrollTo({top:document.getElementById('report').offsetTop-70,behavior:'smooth'})}
function exportExcel(){let rows=[['Customer','Phone','Address','Service Date','Type','Service/Product','Additional','Amount','Payment','Reminder Months','Next Service','Google Location','Notes'],...data.map(x=>[x.name,x.phone,x.address,x.date,x.type,x.product,x.additional,x.amount,x.payment,x.months,x.nextDate,x.location,x.notes])];let csv='\\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\\r\\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='chimney_service_report_'+new Date().toISOString().slice(0,10)+'.csv';a.click()}
function backup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='chimney_backup.json';a.click()}
function restore(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x))throw 0;data=x;save();alert('Data restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)};i.click()}
function shareApp(){let text='Chimney & Gas Service data. To share the actual data, use Backup Data and send the JSON file on WhatsApp. The receiver can use Restore Data to import it.';if(navigator.share){navigator.share({title:'Chimney Service Data',text}).catch(()=>{})}else{let url='https://wa.me/?text='+encodeURIComponent(text);window.open(url,'_blank')}}
render();document.getElementById('serviceDate').value=new Date().toISOString().slice(0,10);
</script></body></html>
